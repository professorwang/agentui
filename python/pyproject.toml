[project]
name = "agentui"
version = "1.0.0"
description = "AgentUI — declarative UI blocks for agent responses: wire builders, validation, and the v1 component catalog (reference Python implementation)"
# readme 顶层写（子目录引用不在项目根内，uv/hatch 不允许）
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["agents", "ui", "declarative", "llm", "chat", "streaming"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentui"]
